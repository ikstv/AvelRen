services:
  test-db:
    image: timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
    command: [postgres, -c, timescaledb.telemetry_level=off]
    environment:
      POSTGRES_USER: avelren_admin
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: postgres
    volumes:
      - ..:/workspace:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U avelren_admin -d postgres']
      interval: 3s
      timeout: 5s
      retries: 40
    networks: [isolated]
  test:
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: ..
      dockerfile: ops/Dockerfile.database-test
    environment:
      AVELREN_DATABASE_TEST: '1'
      DATABASE_URL: postgresql://avelren_migrator:ci-only@test-db:5432/avelren_database_test
      PYTHONPATH: /workspace/services/backend/src
    volumes:
      - ..:/workspace:ro
    working_dir: /workspace
    networks: [isolated]
networks:
  isolated:
    internal: true
