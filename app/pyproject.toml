[project]
name = "avelren"
version = "0.1.0"
description = "Історія завантаженості пунктів пропуску (єЧерга, вантажівки)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # google-auth не тягне requests сам, але його транспорт для оновлення
    # токена без нього не працює.
    "google-auth>=2.35",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
