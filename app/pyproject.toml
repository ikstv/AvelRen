[project]
name = "avelren"
version = "0.1.0"
description = "Border checkpoint workload history (eCherha, trucks)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # google-auth does not pull requests itself, but its transport for token
    # refresh does not work without it.
    "google-auth>=2.35",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The build directory is not source code; the linter only makes noise on it.
extend-exclude = ["build"]

# The rule set is listed explicitly: otherwise the ruff version in CI and on a
# developer's machine would check different things, and a check that depends on
# where it was run guarantees nothing. The broad `except Exception` here is
# deliberate (the collector and watchdog must not crash), so we do not enable BLE.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
