# CI зʼявився за підсумком аудиту: файли Android випали з git через .gitignore,
# і без перевірки чистого клону цього не міг помітити ніхто. Кожна робота тут
# відповідає на конкретний спосіб зламатися, який уже траплявся або майже.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Спосіб зламатися №1 (уже траплявся): критичні файли не потрапили в git,
  # локальна збірка працює, репозиторій — ні.
  completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Критичні файли присутні в дереві git
        run: |
          set -e
          for f in \
            android/app/src/main/java/ua/avelren/app/data/Api.kt \
            android/app/src/main/java/ua/avelren/app/data/DeviceStore.kt \
            app/src/avelren/collector.py \
            app/src/avelren/notifier.py \
            app/src/avelren/watchdog.py \
            db/migrations/001_init.sql \
            deploy/backup.sh \
            deploy/restore.sh \
            deploy/telemetry-snapshot.sh \
            deploy/avelren-telemetry.service \
            deploy/avelren-telemetry.timer \
            db/migrations/008_notification_cancels.sql \
            app/src/avelren/cancels.py \
            android/app/src/main/java/ua/avelren/app/notify/AlertReconciliation.kt \
            android/app/src/test/java/ua/avelren/app/notify/AlertReconciliationTest.kt \
            app/src/avelren/schema_verify.py \
            app/src/avelren/restore_smoke.py \
            deploy/restore-verify.sh \
            app/Dockerfile.test \
            docker-compose.backend-test.yml \
            scripts/backend-test.sh
          do
            git ls-files --error-unmatch "$f" >/dev/null || { echo "ВІДСУТНІЙ У GIT: $f"; exit 1; }
          done
      - name: Секрети не закомічені
        run: |
          set -e
          if git ls-files | grep -qE '(^|/)(google-services\.json|.*service-account.*\.json|\.env)$'; then
            echo "У git знайдено секрети:"; git ls-files | grep -E '(^|/)(google-services\.json|.*service-account.*\.json|\.env)$'
            exit 1
          fi

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canonical backend workflow
        run: bash scripts/backend-test.sh

      - name: Security/setup contract smoke
        run: |
          set -euo pipefail
          ! grep -A3 '^:80 {' deploy/Caddyfile | grep -q 'reverse_proxy'
          grep -A1 '^:80 {' deploy/Caddyfile | grep -q 'redir https://{host}{uri} permanent'
          grep -A6 '^https://api\.bordersignal\.pp\.ua {' deploy/Caddyfile | grep -q 'reverse_proxy api:8000'
          ! grep -q '^DATABASE_URL=postgresql://avelren:@' .env.example
          python - <<'PY'
          from pathlib import Path
          config = Path("app/src/avelren/config.py").read_text()
          assert "postgres_password" in config
          assert "quote(self.postgres_password, safe='')" in config
          assert "database_url" in config
          print("security/setup contract ok")
          PY
          python - <<'PY'
          from pathlib import Path
          caddy = Path("deploy/Caddyfile").read_text().lower()
          rate = Path("app/src/avelren/ratelimit.py").read_text().lower()
          assert "header_up -x-forwarded-for" in caddy
          assert "header_up -x-avelren-client-ip" in caddy
          assert "header_up x-avelren-client-ip {http.request.remote.host}" in caddy
          assert "x-avelren-client-ip" in rate
          assert "x-forwarded-for" not in rate
          print("trusted-proxy contract ok")
          PY

      - name: DR restore-verify — синтаксис
        run: bash -n deploy/restore-verify.sh

      - name: Restore contract regression tests
        run: bash deploy/restore-contract-test.sh

      - name: Docker Compose config
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci docker compose config --quiet

      - name: Snapshot script — синтаксис
        run: bash -n deploy/telemetry-snapshot.sh

      - name: Snapshot script — реальний прогін на runner-хості
        # Ubuntu-runner має /proc/loadavg, /proc/meminfo, df, openssl тощо —
        # тобто script може виконатися в тому самому середовищі, що й на
        # production. Це доводить, що telemetry-pipeline не деградує на нових
        # версіях coreutils/openssl і що JSON парситься.
        run: |
          set -euo pipefail
          export AVELREN_FS_PROBE=/
          # Каталог за замовчуванням /var/lib/avelren-telemetry потребує root;
          # переспрямуємо в user-writable місце.
          sudo mkdir -p /var/lib/avelren-telemetry
          sudo chown "$USER" /var/lib/avelren-telemetry
          bash deploy/telemetry-snapshot.sh
          python -c "import json; d=json.load(open('/var/lib/avelren-telemetry/host.json')); \
            assert d['collected_at']; \
            assert d['system']['cpu_count'] > 0; \
            assert 'network' in d and 'backups' in d and 'certificate' in d; \
            print('snapshot ok:', d['system']['cpu_count'], 'CPUs')"

      - name: Snapshot script — фільтрація мережевих інтерфейсів
        # Регресія на review PR #3: у /proc/net/dev назви вирівняні пробілами
        # ("    lo:"), і bash-варіант ${name## } зрізав лише один пробіл, тож
        # lo/docker*/br-*/veth* мовчки потрапляли в лічильник зовнішнього
        # трафіку. CI-прогін вище цього не ловив — він перевіряв лише
        # наявність ключа "network". Тут перевіряємо саме відбір.
        run: |
          set -euo pipefail
          # Синтетичний /proc/net/dev. eth0 — рівно 1 ГБ rx / 2 ГБ tx;
          # lo, docker0, veth9a, br-abc мають бути відкинуті (у них сотні ГБ,
          # тож будь-яка домішка одразу зіб'є точні 1.00/2.00). Асершн виду
          # "== 0" пройшов би й при зламаному відборі, який викидає геть усе,
          # тому перевіряємо саме точні значення eth0.
          #
          # Провідні пробіли навмисні — у справжньому /proc/net/dev назви
          # вирівняні саме так, і це та деталь, на якій фільтр і зламався.
          cat > /tmp/fake_net_dev <<'NETDEV'
          Inter-|   Receive                                                |  Transmit
           face |bytes    packets errs drop fifo frame compressed multicast|bytes    packets errs drop fifo colls carrier compressed
              lo: 500000000000  100    0    0    0     0          0         0 500000000000   100    0    0    0     0       0          0
          docker0: 400000000000  200    0    0    0     0          0         0 400000000000   200    0    0    0     0       0          0
           veth9a: 300000000000  200    0    0    0     0          0         0 300000000000   200    0    0    0     0       0          0
           br-abc: 200000000000  200    0    0    0     0          0         0 200000000000   200    0    0    0     0       0          0
            eth0: 1073741824  300    0    0    0     0          0         0 2147483648   300    0    0    0     0       0          0
          NETDEV
          # Прогін САМОГО script (через AVELREN_NET_DEV), а не його копії:
          # інакше правка script не ламала б цей тест.
          export AVELREN_FS_PROBE=/ AVELREN_NET_DEV=/tmp/fake_net_dev
          bash deploy/telemetry-snapshot.sh
          python -c "import json; \
            net = json.load(open('/var/lib/avelren-telemetry/host.json'))['network']; \
            assert net['rx_total_gb'] == 1.0, 'rx має бути 1.00 ГБ (лише eth0): %r' % net; \
            assert net['tx_total_gb'] == 2.0, 'tx має бути 2.00 ГБ (лише eth0): %r' % net; \
            print('interface filtering ok:', net)"

      - name: Snapshot script — семантика updates (null / 0 / fail-safe)
        # Регресія: 0 і null — різні стани. probe відсутній або зламаний має
        # давати null («невідомо»), а не 0 («немає»), інакше збій apt-check
        # виглядає як здоровий хост. І ненульовий вихід probe не сміє класти
        # ввесь snapshot під set -euo pipefail.
        run: |
          set -euo pipefail
          export AVELREN_FS_PROBE=/
          rd() { python -c "import json,sys; print(json.load(open('/var/lib/avelren-telemetry/host.json'))['system'][sys.argv[1]])" "$1"; }

          # 1. Валідний вивід "5;2" → числа.
          printf '#!/bin/sh\necho "5;2" >&2\n' > /tmp/apt_ok; chmod +x /tmp/apt_ok
          AVELREN_APT_CHECK=/tmp/apt_ok bash deploy/telemetry-snapshot.sh
          [ "$(rd updates_pending)" = 5 ] && [ "$(rd updates_security)" = 2 ] \
            || { echo "валідний probe має дати 5/2"; exit 1; }

          # 2. probe відсутній → null (не 0).
          AVELREN_APT_CHECK=/tmp/does_not_exist bash deploy/telemetry-snapshot.sh
          [ "$(rd updates_pending)" = None ] && [ "$(rd updates_security)" = None ] \
            || { echo "відсутній probe має дати null, а не 0"; exit 1; }

          # 3. probe завершується ненульово → snapshot виживає, поля null.
          printf '#!/bin/sh\nexit 1\n' > /tmp/apt_fail; chmod +x /tmp/apt_fail
          AVELREN_APT_CHECK=/tmp/apt_fail bash deploy/telemetry-snapshot.sh
          [ "$(rd updates_pending)" = None ] \
            || { echo "ненульовий probe не має валити snapshot; поле лишається null"; exit 1; }
          echo "updates semantics ok"

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Заглушка google-services.json
        # Справжній файл — секрет і в git не живе. Для перевірки компіляції
        # достатньо синтаксично валідної заглушки з правильним package.
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-stub",
              "storage_bucket": "ci-stub.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "ua.avelren.app" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIza-ci-stub-not-a-real-key-000000000" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
      - name: Збірка
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q

      - name: JVM unit-тести
        # Досі Android перевірявся лише компіляцією й lint — поведінка не
        # тестувалась. Reconciliation-логіка A-02 крихка (розбір ключів,
        # set-diff, no-truncation), тож її прогін тут обов'язковий.
        run: cd android && ./gradlew testDebugUnitTest --no-daemon -q

      - name: Лінтер Android
        run: cd android && ./gradlew lintDebug --no-daemon -q
