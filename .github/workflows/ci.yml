# CI came out of the audit: Android files fell out of git via .gitignore, and
# without a clean-clone check nobody could notice it. Every job here answers a
# concrete way to break that has already happened or nearly did.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Way to break #1 (already happened): critical files did not make it into git,
  # the local build works but the repository does not.
  completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Critical files present in the git tree
        run: |
          set -e
          for f in \
            android/app/src/main/java/ua/avelren/app/data/Api.kt \
            android/app/src/main/java/ua/avelren/app/data/DeviceStore.kt \
            app/src/avelren/collector.py \
            app/src/avelren/notifier.py \
            app/src/avelren/watchdog.py \
            db/migrations/001_init.sql \
            deploy/backup.sh \
            deploy/backup-contract-test.sh \
            deploy/restore.sh \
            deploy/restore-engine.lib.sh \
            deploy/restore-engine-contract-test.sh \
            deploy/restore-production.sh \
            deploy/restore-production-contract-test.sh \
            deploy/restore-production-integration-test.sh \
            deploy/telemetry-snapshot.sh \
            deploy/avelren-telemetry.service \
            deploy/avelren-telemetry.timer \
            deploy/compose-security-contract-test.sh \
            db/migrations/008_notification_cancels.sql \
            app/src/avelren/cancels.py \
            android/app/src/main/java/ua/avelren/app/notify/AlertReconciliation.kt \
            android/app/src/test/java/ua/avelren/app/notify/AlertReconciliationTest.kt \
            app/src/avelren/schema_verify.py \
            app/src/avelren/admin_enroll.py \
            app/src/avelren/restore_smoke.py \
            deploy/restore-verify.sh \
            app/Dockerfile.test \
            docker-compose.backend-test.yml \
            scripts/backend-test.sh
          do
            git ls-files --error-unmatch "$f" >/dev/null || { echo "MISSING FROM GIT: $f"; exit 1; }
          done
      - name: Secrets not committed
        run: |
          set -e
          if git ls-files | grep -qE '(^|/)(google-services\.json|.*service-account.*\.json|\.env)$'; then
            echo "Secrets found in git:"; git ls-files | grep -E '(^|/)(google-services\.json|.*service-account.*\.json|\.env)$'
            exit 1
          fi

      # AGENTS.md rule 1: only the `collector` service talks to echerha.gov.ua —
      # never the mobile app, web front-end or user's browser. If a client lacks
      # data we extend our own API, we do not let the client reach eCherha
      # directly. The threat this guards is a NETWORK CALL from the client to the
      # source — and those live in the data layer (Api.kt, base URLs, the HTTP
      # client). So the scan is scoped to `.../app/data/`, NOT all of src/main.
      #
      # Do NOT widen this back to src/main. Since the Play "Misleading Claims"
      # fix, the UI legitimately DISPLAYS the source for attribution — a visible
      # "єЧерга (echerha.gov.ua)" line with a browser link (ui/Attribution.kt).
      # That is required text + an ACTION_VIEW to the official site, not a client
      # fetch of the data API; widening the scan would fail CI on that legal text.
      # Test sources are excluded too — they deserialize server telemetry that
      # reports the collector's upstream URL as data.
      - name: The mobile app does not reach eCherha
        run: |
          set -e
          if grep -rnE '"[^"]*(echerha|gov\.ua)' android/app/src/main/java/ua/avelren/app/data --include='*.kt'; then
            echo "VIOLATION of AGENTS.md rule 1: the app's network layer names eCherha/gov.ua directly."
            echo "The client must talk EXCLUSIVELY to our API (BuildConfig.API_BASE_URL). Extend the API, do not let the phone reach out."
            exit 1
          fi

      # AGENTS.md rule 5: a migration must not use ALTER DEFAULT PRIVILEGES,
      # except 010 (which sets the schema-wide least-privilege posture). A later
      # migration that grants avelren_backup via default privileges silently
      # breaks the adoption inverse-rollback contract: the inverse plan restores
      # to a manifest captured before the migrate gate and reverts only 010's two
      # hand-written default-ACL lines, so anything else is left over and the
      # `Cold adoption integration` scenario fails with an exact-manifest
      # mismatch (issue #144). Future objects stay backup-readable via an
      # explicit GRANT SELECT in the migration instead, enforced by
      # test_backup_can_read_every_public_table_and_sequence.
      - name: Migrations do not use ALTER DEFAULT PRIVILEGES outside 010
        run: |
          set -e
          # Flatten newlines per file before matching: a line-oriented grep would
          # miss `ALTER DEFAULT\n  PRIVILEGES`, which is exactly the silent hole a
          # gate against a recurring class must not have.
          bad=
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if tr '\n' ' ' < "$f" | grep -qiE 'alter[[:space:]]+default[[:space:]]+privileges'; then
              echo "VIOLATION of AGENTS.md rule 5: $f uses ALTER DEFAULT PRIVILEGES."
              bad=1
            fi
          done < <(git ls-files -- 'db/migrations/*.sql' | grep -v '^db/migrations/010_')
          if [ -n "$bad" ]; then
            echo "This collides with the adoption inverse-rollback contract (issue #144)."
            echo "Grant future objects with an explicit GRANT SELECT to avelren_backup instead."
            exit 1
          fi

      - name: Every pg_isready probe answers for TCP, not the unix socket
        run: |
          set -e
          # A probe on the unix socket answers for the temporary server initdb
          # runs during first-time setup — that server listens on the socket
          # only. The container reports Healthy, `condition: service_healthy`
          # releases, and the first client hits a TCP port nobody is listening on
          # yet (#146: Healthy at 17:03:12.0, connection refused at 17:03:12.2).
          # The readiness probe must use the same transport as the clients.
          bad=
          while IFS= read -r hit; do
            # Strip the `file:line:` prefix and skip comment lines — otherwise a
            # comment explaining this very rule counts as a violation of it.
            body=$(printf '%s' "${hit#*:*:}" | sed 's/^[[:space:]]*//')
            case "$body" in \#*) continue ;; esac
            case "$body" in
              *"pg_isready -h "*) ;;
              *) echo "VIOLATION: probe does not force TCP: $hit"; bad=1 ;;
            esac
          done < <(git grep -n 'pg_isready' -- 'deploy/*.sh' 'docker-compose*.yml' || true)
          if [ -n "$bad" ]; then
            echo "Add -h 127.0.0.1 so the probe fails while only the init server is up."
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: The dependency lock matches pyproject (#23)
        run: |
          set -euo pipefail
          # Placed in `completeness` because this is a REQUIRED check: in the
          # dependency-audit workflow the same test would only glow, not block,
          # and a lock that silently stops matching pyproject is a lock that
          # stopped meaning anything.
          #
          # uv from PyPI rather than a setup action, for the same reason as
          # pip-audit: this repository pins every action by SHA, so adding one
          # more is a supply-chain decision — taken here, inside a supply-chain
          # gate. It also resolves for a target Python version without needing
          # that interpreter, which matters: the image ships 3.14 and a lock
          # resolved under anything else describes a set nobody runs.
          python -m pip install --quiet uv
          # Compiled INTO A COPY of the committed lock, not into an empty file.
          # uv treats an existing output file as preferences, so the check asks
          # "does this lock still satisfy pyproject" rather than "is this the
          # newest possible resolution". Compiling into an empty path would turn
          # the gate red every time any transitive dependency publishes a
          # release — verified while writing this: anyio went 4.15.0 -> 4.15.1
          # within four hours, which would have blocked unrelated PRs.
          #
          # Confirmed by experiment, not by reading docs: pinning anyio back to
          # 4.15.0 in the preference file and recompiling left it at 4.15.0.
          # --python-platform matters as much as --python-version, and for the
          # same reason: resolve for what ships, not for what you are standing
          # on. Markers are platform-dependent — psycopg pulls tzdata on Windows,
          # uvicorn[standard] pulls uvloop only on Unix — so a lock generated on
          # a developer's Windows box describes an environment production never
          # runs. That is exactly how the first version of this file failed here.
          cp app/requirements.lock /tmp/requirements.lock.check
          uv pip compile app/pyproject.toml \
            --python-version 3.14 --python-platform x86_64-unknown-linux-gnu \
            --generate-hashes --no-header \
            -o /tmp/requirements.lock.check >/dev/null 2>&1

          if ! diff -q app/requirements.lock /tmp/requirements.lock.check >/dev/null; then
            echo "app/requirements.lock no longer matches app/pyproject.toml."
            echo "Regenerate it with the same command:"
            echo "  uv pip compile app/pyproject.toml --python-version 3.14 \\"
            echo "    --python-platform x86_64-unknown-linux-gnu \\"
            echo "    --generate-hashes --no-header -o app/requirements.lock"
            echo
            diff app/requirements.lock /tmp/requirements.lock.check | head -40 || true
            exit 1
          fi

      - name: watchdog knows the hash of the snapshot script it expects (#164)
        run: |
          set -e
          # The snapshot script does not run from the checkout — systemd executes
          # an installed copy — so the image carries the hash it was built against
          # and alerts when the host runs something else. That only works while the
          # constant tracks the file: a stale constant would either cry drift on a
          # correct host, or stay silent on the stale one this gate exists for.
          want=$(sha256sum deploy/telemetry-snapshot.sh | cut -d' ' -f1)
          have=$(grep -oE 'EXPECTED_SNAPSHOT_SHA = "[0-9a-f]{64}"' \
                   app/src/avelren/watchdog.py | grep -oE '[0-9a-f]{64}' || true)
          if [ "$want" != "$have" ]; then
            echo "deploy/telemetry-snapshot.sh changed but EXPECTED_SNAPSHOT_SHA did not."
            echo "  script:   $want"
            echo "  watchdog: ${have:-<not found>}"
            echo "Update the constant in app/src/avelren/watchdog.py to the first value."
            exit 1
          fi

      # AGENTS.md rule 11: every binary asset (image/font/audio/video) committed
      # to the app must carry a provenance row in docs/ASSETS.md (file, source,
      # license, date). An asset with unknown origin is an IP/licensing risk in
      # the store — this gate refuses a new binary that nobody documented.
      # Matches by file name, so the row may reference the path or just the name.
      - name: Binary assets have provenance in docs/ASSETS.md
        run: |
          set -e
          missing=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            base=$(basename "$f")
            grep -qF "$base" docs/ASSETS.md || { echo "NO PROVENANCE (add a row to docs/ASSETS.md): $f"; missing=1; }
          done <<EOF
          $(git ls-files -- 'android/app/src/main/res/drawable*' 'android/app/src/main/res/mipmap*' 'android/app/src/main/res/font/*' 'android/app/src/main/assets/*' | grep -iE '\.(png|jpg|jpeg|webp|gif|ttf|otf|mp3|wav|ogg|mp4)$' || true)
          EOF
          if [ "$missing" != 0 ]; then
            echo "AGENTS.md rule 11: every binary asset needs a provenance row in docs/ASSETS.md."
            exit 1
          fi

  # Supply-chain gate (issue #23, audit F4): a CycloneDX SBOM of the whole tree
  # (python deps from app/pyproject.toml, gradle catalog, pinned images) on every
  # push to main, kept as a build artifact. This is the inventory half of #23 —
  # what exactly ships — so a disclosed CVE can be answered from the artifact
  # instead of by re-deriving the dependency set. Pinned by commit SHA like every
  # other action here (v0.24.0); Dependabot re-pins it.
  sbom:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: avelren-sbom.cdx.json

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Canonical backend workflow
        timeout-minutes: 20
        run: bash scripts/backend-test.sh

      - name: PostgreSQL shell syntax
        timeout-minutes: 5
        run: bash -n deploy/postgres-bootstrap.sh deploy/postgres-adopt.sh deploy/postgres-ownership.lib.sh deploy/postgres-adoption-bootstrap-topology-test.sh

      - name: PostgreSQL bootstrap contract
        timeout-minutes: 5
        run: bash deploy/postgres-bootstrap-contract-test.sh

      - name: PostgreSQL role privileges and positive service paths
        timeout-minutes: 30
        run: bash deploy/postgres-roles-integration-test.sh

      - name: Compose database credential isolation
        timeout-minutes: 5
        run: bash deploy/compose-security-contract-test.sh

      - name: Docker Compose config
        timeout-minutes: 5
        run: docker compose --env-file .env.example config --quiet

      - name: Security/setup contract smoke
        run: |
          set -euo pipefail
          ! grep -A3 '^:80 {' deploy/Caddyfile | grep -q 'reverse_proxy'
          grep -A1 '^:80 {' deploy/Caddyfile | grep -q 'redir https://{host}{uri} permanent'
          grep -A14 '^https://api\.bordersignal\.pp\.ua {' deploy/Caddyfile | grep -q 'reverse_proxy api:8000'
          ! grep -q '^DATABASE_URL=postgresql://avelren:@' .env.example
          python - <<'PY'
          from pathlib import Path
          config = Path("app/src/avelren/config.py").read_text()
          assert "postgres_password" in config
          assert "quote(self.postgres_password, safe='')" in config
          assert "database_url" in config
          print("security/setup contract ok")
          PY
          python - <<'PY'
          from pathlib import Path
          caddy = Path("deploy/Caddyfile").read_text().lower()
          rate = Path("app/src/avelren/ratelimit.py").read_text().lower()
          assert "header_up -x-forwarded-for" in caddy
          assert "header_up -x-avelren-client-ip" in caddy
          assert "header_up x-avelren-client-ip {http.request.remote.host}" in caddy
          assert "request_body" in caddy and "max_size 64kb" in caddy, "Caddy /api/* must cap request body (M-2)"
          assert "x-avelren-client-ip" in rate
          assert "x-forwarded-for" not in rate
          print("trusted-proxy contract ok")
          PY

      - name: Caddyfile validate
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.9.1-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: DR restore-verify — syntax
        run: |
          bash -n deploy/backup.sh
          bash -n deploy/backup-contract-test.sh
          bash -n deploy/restore.sh
          bash -n deploy/restore-engine.lib.sh
          bash -n deploy/restore-engine-contract-test.sh
          bash -n deploy/restore-production.sh
          bash -n deploy/restore-verify.sh
          bash -n deploy/restore-verify-guard-contract-test.sh
          bash -n deploy/restore-production-contract-test.sh
          bash -n deploy/restore-production-integration-test.sh
          bash -n deploy/postgres-privilege-gate.sh
          bash -n deploy/postgres-privilege-gate-contract-test.sh
          docker compose -f docker-compose.yml -f docker-compose.privilege-gate.yml config >/dev/null
          sudo install -m 0755 deploy/backup.sh /usr/local/sbin/avelren-backup
          systemd-analyze verify deploy/avelren-backup.service

      - name: Backup permission, cleanup, verification and stamp contract
        timeout-minutes: 5
        run: bash deploy/backup-contract-test.sh

      - name: Restore contract regression tests
        timeout-minutes: 10
        run: |
          bash deploy/restore-contract-test.sh
          bash deploy/restore-engine-contract-test.sh
          bash deploy/restore-verify-guard-contract-test.sh

      - name: Restore allowlist contract
        timeout-minutes: 5
        run: python3 deploy/restore-allowlist-contract-test.py

      - name: Production orchestrator contract tests
        timeout-minutes: 10
        run: bash deploy/restore-production-contract-test.sh

      # The privilege gate is the post-commit acceptance for production adoption.
      # It was previously only `bash -n`-checked, never executed, which is how a
      # gate that could not run at all reached a production attempt (2026-08-14):
      # it aborted on app/tests/conftest.py's destructive-suite guard before any
      # assertion. A syntax check cannot catch that; running the contract can.
      - name: Privilege gate contract
        timeout-minutes: 5
        run: bash deploy/postgres-privilege-gate-contract-test.sh

      - name: Actual disposable restore integration
        timeout-minutes: 20
        run: bash deploy/restore-integration-test.sh

      - name: Disposable production-mode restore integration
        timeout-minutes: 25
        run: bash deploy/restore-production-integration-test.sh

      - name: PostgreSQL adoption contract
        timeout-minutes: 10
        run: bash deploy/postgres-adoption-contract-test.sh

      - name: Cold adoption integration - before_commit
        timeout-minutes: 30
        run: AVELREN_ADOPTION_SCENARIO=before_commit bash deploy/postgres-adoption-integration-test.sh

      - name: Cold adoption integration - after_commit
        timeout-minutes: 45
        run: AVELREN_ADOPTION_SCENARIO=after_commit bash deploy/postgres-adoption-integration-test.sh

      - name: Cold adoption integration - success
        timeout-minutes: 45
        run: AVELREN_ADOPTION_SCENARIO=success bash deploy/postgres-adoption-integration-test.sh

      - name: Cold adoption integration - production
        timeout-minutes: 45
        run: AVELREN_ADOPTION_SCENARIO=production bash deploy/postgres-adoption-integration-test.sh

      - name: Bootstrap-superuser topology adoption integration
        timeout-minutes: 45
        run: bash deploy/postgres-adoption-bootstrap-topology-test.sh

      - name: Snapshot script — syntax
        run: bash -n deploy/telemetry-snapshot.sh

      - name: Snapshot script — a real run on the runner host
        # The Ubuntu runner has /proc/loadavg, /proc/meminfo, df, openssl, etc. —
        # so the script can run in the same environment as production. This proves
        # the telemetry pipeline does not degrade on newer versions of
        # coreutils/openssl and that the JSON parses.
        run: |
          set -euo pipefail
          export AVELREN_FS_PROBE=/
          # The default directory /var/lib/avelren-telemetry needs root; redirect
          # it to a user-writable location.
          sudo mkdir -p /var/lib/avelren-telemetry
          sudo chown "$USER" /var/lib/avelren-telemetry
          bash deploy/telemetry-snapshot.sh
          python -c "import json; d=json.load(open('/var/lib/avelren-telemetry/host.json')); \
            assert d['collected_at']; \
            assert d['system']['cpu_count'] > 0; \
            assert 'network' in d and 'backups' in d and 'certificate' in d; \
            print('snapshot ok:', d['system']['cpu_count'], 'CPUs')"

      - name: Snapshot script — migrate pin detection (#160)
        # The pin lives in the host's compose override, outside git, and it fell
        # out silently during the #88 window: the deploy runbook catches it, but
        # only during a deploy, so between windows nothing watched the guard.
        # The snapshot now reports it, and this proves the report distinguishes
        # all three states — present, absent, and "could not look".
        #
        # The script is run against a synthetic stack rather than reimplemented
        # here: a copy of the logic in the workflow would pass while the script
        # rots, which is the failure this whole suite exists to prevent.
        run: |
          set -euo pipefail
          pin=/tmp/fake-migrate-pin
          mkdir -p "$pin" /tmp/stack-pinned /tmp/stack-unpinned

          cat > /tmp/stack-pinned/docker-compose.yml <<PINNED
          services:
            migrate:
              image: busybox
              profiles: ["migrate"]
              volumes:
                - type: bind
                  source: $pin
                  target: /migrations
                  read_only: true
          PINNED

          # The regression shape exactly: same service, same target, mounted from
          # the repository instead of the pin.
          cat > /tmp/stack-unpinned/docker-compose.yml <<'UNPINNED'
          services:
            migrate:
              image: busybox
              profiles: ["migrate"]
              volumes:
                - ./db/migrations:/migrations:ro
          UNPINNED

          # Run as the runner user, not under sudo, for the same reason the step
          # above does: the `docker compose` CLI plugin is installed for the
          # runner user, so under root it is simply not found and the snapshot
          # reports null — "could not look" — which would make this test pass or
          # fail for a reason that has nothing to do with the pin.
          sudo mkdir -p /var/lib/avelren-telemetry
          sudo chown "$USER" /var/lib/avelren-telemetry

          run_snapshot() {
            AVELREN_STACK_DIR="$1" AVELREN_MIGRATE_PIN_PATH="$pin" \
              AVELREN_FS_PROBE=/ \
              bash deploy/telemetry-snapshot.sh
            python3 -c 'import json,sys; print(json.load(open("/var/lib/avelren-telemetry/host.json"))["docker"]["migrate_pin_active"])'
          }

          got=$(run_snapshot /tmp/stack-pinned)
          [ "$got" = True ] || { echo "pinned stack reported $got, expected True"; exit 1; }

          got=$(run_snapshot /tmp/stack-unpinned)
          [ "$got" = False ] || { echo "unpinned stack reported $got, expected False"; exit 1; }

          # A stack directory that does not exist: the snapshot must say "unknown",
          # not "broken". A watchdog that treats an unreadable host as a lost pin
          # gets muted within a week.
          got=$(run_snapshot /tmp/definitely-absent)
          [ "$got" = None ] || { echo "absent stack reported $got, expected None"; exit 1; }

      - name: Snapshot script — network interface filtering
        # Regression from review of PR #3: in /proc/net/dev the names are aligned
        # with spaces ("    lo:"), and the bash form ${name## } trimmed only one
        # space, so lo/docker*/br-*/veth* silently ended up in the external
        # traffic counter. The CI run above did not catch it — it only checked for
        # the presence of the "network" key. Here we check the selection itself.
        run: |
          set -euo pipefail
          # A synthetic /proc/net/dev. eth0 — exactly 1 GB rx / 2 GB tx;
          # lo, docker0, veth9a, br-abc must be discarded (they have hundreds of
          # GB, so any leak-through immediately breaks the exact 1.00/2.00). An
          # assertion like "== 0" would pass even with a broken selection that
          # throws out everything, so we check eth0's exact values.
          #
          # The leading spaces are intentional — in a real /proc/net/dev the names
          # are aligned exactly like this, and that is the detail the filter broke
          # on.
          cat > /tmp/fake_net_dev <<'NETDEV'
          Inter-|   Receive                                                |  Transmit
           face |bytes    packets errs drop fifo frame compressed multicast|bytes    packets errs drop fifo colls carrier compressed
              lo: 500000000000  100    0    0    0     0          0         0 500000000000   100    0    0    0     0       0          0
          docker0: 400000000000  200    0    0    0     0          0         0 400000000000   200    0    0    0     0       0          0
           veth9a: 300000000000  200    0    0    0     0          0         0 300000000000   200    0    0    0     0       0          0
           br-abc: 200000000000  200    0    0    0     0          0         0 200000000000   200    0    0    0     0       0          0
            eth0: 1073741824  300    0    0    0     0          0         0 2147483648   300    0    0    0     0       0          0
          NETDEV
          # Run the script ITSELF (via AVELREN_NET_DEV), not a copy of it:
          # otherwise editing the script would not break this test.
          export AVELREN_FS_PROBE=/ AVELREN_NET_DEV=/tmp/fake_net_dev
          bash deploy/telemetry-snapshot.sh
          python -c "import json; \
            net = json.load(open('/var/lib/avelren-telemetry/host.json'))['network']; \
            assert net['rx_total_gb'] == 1.0, 'rx should be 1.00 GB (eth0 only): %r' % net; \
            assert net['tx_total_gb'] == 2.0, 'tx should be 2.00 GB (eth0 only): %r' % net; \
            print('interface filtering ok:', net)"

      - name: Snapshot script — updates semantics (null / 0 / fail-safe)
        # Regression: 0 and null are different states. A missing or broken probe
        # must give null ("unknown"), not 0 ("none"), otherwise an apt-check
        # failure looks like a healthy host. And a non-zero probe exit must not
        # take down the whole snapshot under set -euo pipefail.
        run: |
          set -euo pipefail
          export AVELREN_FS_PROBE=/
          rd() { python -c "import json,sys; print(json.load(open('/var/lib/avelren-telemetry/host.json'))['system'][sys.argv[1]])" "$1"; }

          # 1. Valid output "5;2" → numbers.
          printf '#!/bin/sh\necho "5;2" >&2\n' > /tmp/apt_ok; chmod +x /tmp/apt_ok
          AVELREN_APT_CHECK=/tmp/apt_ok bash deploy/telemetry-snapshot.sh
          [ "$(rd updates_pending)" = 5 ] && [ "$(rd updates_security)" = 2 ] \
            || { echo "a valid probe should give 5/2"; exit 1; }

          # 2. probe missing → null (not 0).
          AVELREN_APT_CHECK=/tmp/does_not_exist bash deploy/telemetry-snapshot.sh
          [ "$(rd updates_pending)" = None ] && [ "$(rd updates_security)" = None ] \
            || { echo "a missing probe should give null, not 0"; exit 1; }

          # 3. probe exits non-zero → snapshot survives, fields null.
          printf '#!/bin/sh\nexit 1\n' > /tmp/apt_fail; chmod +x /tmp/apt_fail
          AVELREN_APT_CHECK=/tmp/apt_fail bash deploy/telemetry-snapshot.sh
          [ "$(rd updates_pending)" = None ] \
            || { echo "a non-zero probe must not fail the snapshot; the field stays null"; exit 1; }
          echo "updates semantics ok"

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      # Cache the wrapper distribution and the Gradle caches. Without this every
      # run pulls gradle-8.13-bin.zip (~150 MB) from services.gradle.org, and on a
      # dropped TCP connection the whole job fails on the wrapper's `main` thread.
      # In the day before merging #33 this failure happened three times (PR #34
      # rerun 1, PR #34 rerun 2, PR #35 rerun 1) — not a random flake but a
      # rate-limit/network-path pattern. `gradle/actions/setup-gradle@v4` is
      # Gradle's official recommendation: one action covers both the wrapper cache
      # and dependencies; after the first successful run on main, every PR pulls
      # the wrapper from cache. The semantic build/test is UNCHANGED.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: google-services.json stub
        # The real file is a secret and does not live in git. A syntactically
        # valid stub with the correct package is enough for a compile check.
        #
        # We write the stub ONLY if the file does not already exist. On CI the
        # checkout is always clean (the secret never lands in git), so the
        # condition is true and the stub is created as before. But if this same
        # step is run on a developer machine (reproducing the CI build, `act`, a
        # manual run of the block), an unconditional `cat >` would silently
        # overwrite the real google-services.json with the `ci-stub` — and the app
        # would lose FCM (a valid key → IllegalArgumentException "valid API key",
        # no token, the installation stays Unavailable). That is exactly what took
        # the client down on 2026-08-14. The guard makes the step safe for a local
        # run.
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json already present — leaving it as is (not overwriting with the stub)."
            exit 0
          fi
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-stub",
              "storage_bucket": "ci-stub.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "ua.avelren.app" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "AIza-ci-stub-not-a-real-key-000000000" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          EOF
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q

      - name: JVM unit tests
        # Until now Android was checked only by compilation and lint — behavior
        # was not tested. The A-02 reconciliation logic is fragile (key parsing,
        # set-diff, no-truncation), so running it here is mandatory.
        run: cd android && ./gradlew testDebugUnitTest --no-daemon -q

      - name: Android linter
        run: cd android && ./gradlew lintDebug --no-daemon -q
