name: Правила репозиторію
on:
  pull_request:
    paths: ['.github/**', 'docs/**', 'scripts/**', 'tools/**', 'AGENTS.md', 'CONTRIBUTING.md', 'README.md']
  push:
    branches: [main]
    paths: ['.github/**', 'docs/**', 'scripts/**', 'tools/**', 'AGENTS.md', 'CONTRIBUTING.md', 'README.md']
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: YAML-парсер
        # Окремий малий інструмент перевірки конфігурації, не залежність застосунку.
        run: python3 -m pip install PyYAML==6.0.3
      - name: Поділ CI та походження
        run: |
          python3 scripts/verify_ci_scopes.py
          python3 scripts/verify_core_provenance.py
          python3 scripts/verify_android.py
      - name: Контракти інструмента перенесення
        # Реальний Gitleaks-тест потребує binary у PATH; окремий локальний доказ у TASK-01.
        run: python3 -m unittest discover -s tools/tests -p 'test_consolidate_legacy_repositories.py' -v
