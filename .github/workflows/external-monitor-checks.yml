name: Контракти зовнішнього монітора
on:
  pull_request:
    paths: ['scripts/classify_alert_channel.py', 'scripts/tests/**', '.github/workflows/external-health-monitor.yml', '.github/workflows/external-monitor-checks.yml']
  push:
    branches: [main]
    paths: ['scripts/classify_alert_channel.py', 'scripts/tests/**', '.github/workflows/external-health-monitor.yml', '.github/workflows/external-monitor-checks.yml']
permissions:
  contents: read
jobs:
  monitor-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Тестовий інструмент
        run: python -m pip install pytest==9.1.1 PyYAML==6.0.3
      - name: Класифікація без мережі й production
        run: python -m pytest scripts/tests -q
