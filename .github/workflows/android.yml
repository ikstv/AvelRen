name: Android
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'services/backend/src/avelren/api.py'
      - 'services/backend/src/avelren/schemas.py'
      - 'services/backend/src/avelren/subscriptions_api.py'
      - 'services/backend/src/avelren/admin_access_api.py'
      - 'services/backend/src/avelren/maintenance.py'
      - 'services/backend/src/avelren/surge*.py'
      - 'docs/ANDROID-PROVENANCE.json'
      - 'docs/ASSETS.md'
      - 'scripts/verify_android.py'
      - 'scripts/verify_push_qa.py'
      - '.github/workflows/android.yml'
      - '.gitattributes'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'services/backend/src/avelren/api.py'
      - 'services/backend/src/avelren/schemas.py'
      - 'services/backend/src/avelren/subscriptions_api.py'
      - 'services/backend/src/avelren/admin_access_api.py'
      - 'services/backend/src/avelren/maintenance.py'
      - 'services/backend/src/avelren/surge*.py'
      - 'docs/ANDROID-PROVENANCE.json'
      - 'docs/ASSETS.md'
      - 'scripts/verify_android.py'
      - 'scripts/verify_push_qa.py'
      - '.github/workflows/android.yml'
      - '.gitattributes'
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Походження та ресурси
        run: python3 scripts/verify_android.py
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Компіляція та JVM-тести без ключів
        working-directory: apps/android
        run: bash gradlew -PavelrenUiPreview=true :app:testDebugUnitTest :app:compileDebugKotlin :app:lintDebug --no-daemon --max-workers=2
      - name: Окремий FCM QA — компіляція без справжнього Firebase
        working-directory: apps/android
        run: bash gradlew -PavelrenPushQa=true -PavelrenPushQaConfig=app/src/pushQa/fixture.properties :app:assembleDebug :app:lintDebug --no-daemon --max-workers=2
      - name: Ізоляція готового FCM QA пакета
        run: python3 scripts/verify_push_qa.py
      - name: Заборона release для FCM QA
        working-directory: apps/android
        shell: bash
        run: |
          if bash gradlew -PavelrenPushQa=true -PavelrenPushQaConfig=app/src/pushQa/fixture.properties :app:assembleRelease --dry-run --no-daemon --max-workers=2 > "$RUNNER_TEMP/push-qa-release.log" 2>&1; then
            echo 'Unexpected release acceptance'; exit 1
          fi
          grep -q 'Android test modes are debug-only' "$RUNNER_TEMP/push-qa-release.log"
