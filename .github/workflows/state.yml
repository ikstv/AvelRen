name: state

# Keeps STATE.md truthful without human involvement.
#
# PROJECT_STATUS.md twice in one week misled the very reader it was written for —
# the one who arrives with no context and cannot verify what is written. Both
# times the cause was not carelessness but that volatile facts were maintained by
# hand. Here they are not maintained at all: the file is regenerated and
# committed only if it actually changed.
#
# The schedule is needed separately from push: open PRs, issues, and branch drift
# change without any commit to main.

on:
  push:
    branches: [main]
    paths-ignore:
      - STATE.md
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: state
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script computes the distance from the prod pin to main, so it
          # needs the full history — with fetch-depth 1, rev-list would give zero
          # and lie about the very thing this file exists for.
          fetch-depth: 0

      - name: Generate STATE.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/generate-state.sh

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- STATE.md; then
            echo "STATE.md unchanged"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATE.md
          git commit -m 'chore(state): regenerate STATE.md'
          git push
