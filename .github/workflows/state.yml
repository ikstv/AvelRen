name: state

# Keeps STATE.md truthful without human involvement.
#
# PROJECT_STATUS.md twice in one week misled the very reader it was written for —
# the one who arrives with no context and cannot verify what is written. Both
# times the cause was not carelessness but that volatile facts were maintained by
# hand. Here they are not maintained at all: the file is regenerated and
# committed only if it actually changed.
#
# The schedule is needed separately from push: open PRs, issues, and branch drift
# change without any commit to main.

on:
  push:
    branches: [main]
    paths-ignore:
      - STATE.md
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # write, not read: the bot no longer pushes main directly, it opens a PR.
  pull-requests: write
  issues: read

concurrency:
  group: state
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script computes the distance from the prod pin to main, so it
          # needs the full history — with fetch-depth 1, rev-list would give zero
          # and lie about the very thing this file exists for.
          fetch-depth: 0

      - name: Generate STATE.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/generate-state.sh

      # Pushing straight to main stopped working once branch protection began
      # requiring a pull request: every run from 2026-08-31 on died with
      # `GH006: Protected branch update failed`, and STATE.md quietly went stale
      # on main — the precise failure this workflow exists to prevent, now with
      # a red run each morning instead of a wrong file. So the bot proposes the
      # change rather than pushing it, which needs no protection exemption.
      #
      # The branch is reused and committed onto, never force-pushed
      # (AUTHORIZATION.md permits force-push only for a feature-branch rebase).
      #
      # Known cost: a PR opened with GITHUB_TOKEN does not start workflow runs,
      # so the three required checks stay unreported and the owner merges it
      # directly. Giving github-actions[bot] a branch-protection bypass would
      # let this step go back to pushing main outright and drop the PR entirely.
      - name: Open a PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- STATE.md; then
            echo "STATE.md unchanged"
            exit 0
          fi

          branch=chore/state-refresh
          generated=$(mktemp)
          cp STATE.md "$generated"
          # A dirty STATE.md would block the branch checkout below.
          git checkout -- STATE.md

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch"
          fi

          cp "$generated" STATE.md
          if git diff --quiet -- STATE.md; then
            echo "$branch already carries this STATE.md"
            exit 0
          fi

          git add STATE.md
          git commit -m 'chore(state): regenerate STATE.md'
          git push origin "$branch"

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title 'chore(state): regenerate STATE.md' \
              --body 'Opened by the `state` workflow. STATE.md is generated from git and gh by scripts/generate-state.sh — never edit it by hand.'
          fi
