name: API та адміністрування
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Незмінність вихідних файлів
        run: python scripts/verify_core_provenance.py
      - name: Синтаксис сценаріїв
        run: |
          for script in scripts/test_database.sh ops/postgres-bootstrap.sh; do
            bash -n "$script"
          done
      - name: API на повній схемі під обмеженою роллю
        run: bash scripts/test_database.sh api
