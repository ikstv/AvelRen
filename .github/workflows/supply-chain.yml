name: SBOM вихідного коду
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Згенерувати CycloneDX SBOM для дерева джерел
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/avelren-source.cdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Зберегти SBOM як 30-денний artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/avelren-source.cdx.json
          if-no-files-found: error
          retention-days: 30
