name: SBOM вихідного коду
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  source-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Тимчасово відкрити Python lock для cataloger Syft
        run: cp services/backend/requirements.lock services/backend/requirements.txt
      - name: Згенерувати CycloneDX SBOM для дерева джерел
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/avelren-source.cdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Перевірити Python lock і SBOM
        run: python3 scripts/verify_source_sbom.py "$RUNNER_TEMP/avelren-source.cdx.json" services/backend/requirements.lock
      - name: Прибрати тимчасову копію lock-файла
        if: always()
        run: rm -f services/backend/requirements.txt
      - name: Зберегти SBOM як 30-денний artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/avelren-source.cdx.json
          if-no-files-found: error
          retention-days: 30

  image-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Зібрати candidate образ застосунку
        run: |
          image="avelren-candidate:${GITHUB_SHA}"
          docker build --build-arg "SOURCE_COMMIT=${GITHUB_SHA}" --tag "$image" services/backend
          embedded_commit=$(docker run --rm --network none --entrypoint python "$image" -c 'import os; print(os.environ.get("AVELREN_GIT_SHA", ""))')
          test "$embedded_commit" = "$GITHUB_SHA"
      - name: Перевірити frozen модель встановленого wheel
        run: |
          image="avelren-candidate:${GITHUB_SHA}"
          docker run --rm -i --network none --entrypoint python "$image" - < ops/verify-installed-model.py
      - name: Підготувати каталог SBOM
        run: mkdir -p "$RUNNER_TEMP/runtime-image-sbom"
      - name: Завантажити зафіксовані upstream images
        run: |
          docker pull timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
          docker pull caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
      - name: SBOM candidate образу застосунку
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: avelren-candidate:${{ github.sha }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/runtime-image-sbom/avelren-candidate.cdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM зафіксованого TimescaleDB образу
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/runtime-image-sbom/timescaledb.cdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM зафіксованого Caddy образу
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/runtime-image-sbom/caddy.cdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Зняти незалежні inventories пакетних менеджерів
        run: |
          app_image="avelren-candidate:${GITHUB_SHA}"
          timescale_image="timescale/timescaledb:2.30.1-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9"
          caddy_image="caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b"
          docker run --rm --network none --user 0 --entrypoint /usr/bin/dpkg-query "$app_image" -W -f='${db:Status-Abbrev}\t${Package}\t${Version}\n' > "$RUNNER_TEMP/runtime-image-sbom/avelren-candidate.deb.txt"
          docker run --rm --network none --user 0 --entrypoint apk "$timescale_image" --network=no info -v > "$RUNNER_TEMP/runtime-image-sbom/timescaledb.apk.txt"
          docker run --rm --network none --user 0 --entrypoint apk "$caddy_image" --network=no info -v > "$RUNNER_TEMP/runtime-image-sbom/caddy.apk.txt"
      - name: Перевірити Python і системні пакети в image SBOM
        run: python3 scripts/verify_runtime_image_sboms.py "$RUNNER_TEMP/runtime-image-sbom" services/backend/requirements.lock
      - name: Зберегти candidate image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-image-sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30
