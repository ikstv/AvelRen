name: Тимчасова база даних
on:
  pull_request:
    paths:
      - 'db/**'
      - 'ops/**'
      - 'services/backend/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.gitignore'
      - 'scripts/test_database.sh'
      - 'scripts/verify_core_provenance.py'
      - 'docs/CORE-PROVENANCE.json'
      - 'docs/DB-PROVENANCE.json'
      - 'docs/API-PROVENANCE.json'
      - 'docs/WATCHDOG-PROVENANCE.json'
      - '.gitattributes'
      - '.github/workflows/database.yml'
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'ops/**'
      - 'services/backend/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.gitignore'
      - 'scripts/test_database.sh'
      - 'scripts/verify_core_provenance.py'
      - 'docs/CORE-PROVENANCE.json'
      - 'docs/DB-PROVENANCE.json'
      - 'docs/API-PROVENANCE.json'
      - 'docs/WATCHDOG-PROVENANCE.json'
      - '.gitattributes'
      - '.github/workflows/database.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Незмінність вихідних файлів
        run: python3 scripts/verify_core_provenance.py
      - name: Синтаксис сценаріїв
        run: |
          for script in scripts/test_database.sh ops/postgres-bootstrap.sh ops/backup.sh ops/backup-contract-test.sh ops/restore.sh ops/restore-engine.lib.sh ops/restore-verify.sh ops/restore-contract-test.sh ops/restore-engine-contract-test.sh ops/restore-verify-guard-contract-test.sh ops/restore-integration-test.sh ops/compose-production-contract-test.sh; do
            bash -n "$script"
          done
      - name: Контракт backup із фіктивними Docker і rclone
        run: bash ops/backup-contract-test.sh
      - name: Контракти fail-closed restore
        run: |
          bash ops/restore-contract-test.sh
          bash ops/restore-engine-contract-test.sh
          bash ops/restore-verify-guard-contract-test.sh
          python3 ops/restore-allowlist-contract-test.py
      - name: Повна restore-репетиція у тимчасовій TimescaleDB
        run: bash ops/restore-integration-test.sh
      - name: Контракт production Compose без запуску служб
        run: bash ops/compose-production-contract-test.sh
      - name: TimescaleDB, міграції, права та запис даних
        run: bash scripts/test_database.sh
