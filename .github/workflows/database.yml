name: Тимчасова база даних
on:
  pull_request:
    paths:
      - 'db/**'
      - 'ops/**'
      - 'services/backend/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.gitignore'
      - 'scripts/test_database.sh'
      - 'scripts/verify_core_provenance.py'
      - 'docs/CORE-PROVENANCE.json'
      - 'docs/DB-PROVENANCE.json'
      - 'docs/API-PROVENANCE.json'
      - 'docs/WATCHDOG-PROVENANCE.json'
      - '.gitattributes'
      - '.github/workflows/database.yml'
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'ops/**'
      - 'services/backend/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.gitignore'
      - 'scripts/test_database.sh'
      - 'scripts/verify_core_provenance.py'
      - 'docs/CORE-PROVENANCE.json'
      - 'docs/DB-PROVENANCE.json'
      - 'docs/API-PROVENANCE.json'
      - 'docs/WATCHDOG-PROVENANCE.json'
      - '.gitattributes'
      - '.github/workflows/database.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Незмінність вихідних файлів
        run: python3 scripts/verify_core_provenance.py
      - name: Синтаксис сценаріїв
        run: |
          for script in scripts/test_database.sh ops/postgres-bootstrap.sh ops/backup.sh ops/backup-contract-test.sh ops/restore.sh ops/restore-artifact.lib.sh ops/restore-artifact-contract-test.sh ops/restore-production-identity.lib.sh ops/restore-production-identity-contract-test.sh ops/restore-production-preflight.lib.sh ops/restore-production-preflight-contract-test.sh ops/restore-engine.lib.sh ops/restore-production-engine.lib.sh ops/restore-production-engine-contract-test.sh ops/restore-production.sh ops/restore-production-contract-test.sh ops/restore-verify.sh ops/restore-contract-test.sh ops/restore-engine-contract-test.sh ops/restore-verify-guard-contract-test.sh ops/restore-integration-test.sh ops/compose-production-contract-test.sh ops/maintenance-window.sh ops/maintenance-reboot.sh ops/maintenance-window-contract-test.sh ops/maintenance-works.sh ops/maintenance-works-contract-test.sh ops/build-candidate-image.sh ops/candidate-image-attestation-contract-test.sh; do
            bash -n "$script"
          done
      - name: Контракт telemetry systemd units
        run: python3 ops/telemetry-unit-contract-test.py
      - name: Контракт source-only deployment preflight
        run: python3 ops/deployment-preflight-contract-test.py
      - name: Контракт local candidate-image attestation
        run: bash ops/candidate-image-attestation-contract-test.sh
      - name: systemd-analyze verify без запуску служб
        run: |
          sudo install -D -o root -g root -m 0755 ops/telemetry-snapshot.sh /usr/local/sbin/avelren-telemetry-snapshot
          sudo install -D -o root -g root -m 0644 ops/avelren-telemetry.service /etc/systemd/system/avelren-telemetry.service
          sudo install -D -o root -g root -m 0644 ops/avelren-telemetry.timer /etc/systemd/system/avelren-telemetry.timer
          sudo install -D -o root -g root -m 0755 ops/telemetry-snapshot.sh /opt/avelren/ops/telemetry-snapshot.sh
          sudo systemd-analyze verify /etc/systemd/system/avelren-telemetry.service /etc/systemd/system/avelren-telemetry.timer
      - name: Контракт backup із фіктивними Docker і rclone
        # Production backup and its receipt directory are root-owned. The
        # ownership-denial fixture also needs CAP_CHOWN to create a foreign
        # owner on the otherwise unprivileged GitHub runner.
        run: sudo bash ops/backup-contract-test.sh
      - name: Контракти fail-closed restore
        run: |
          bash ops/restore-artifact-contract-test.sh
          bash ops/restore-production-identity-contract-test.sh
          python3 ops/restore-role-pin-contract-test.py
          python3 -m py_compile ops/restore-role-pin.py ops/restore-role-pin-contract-test.py
          bash ops/restore-production-preflight-contract-test.sh
          bash ops/restore-contract-test.sh
          bash ops/restore-engine-contract-test.sh
          bash -n ops/restore-interruption-contract-test.sh
          bash ops/restore-interruption-contract-test.sh
          bash ops/restore-production-engine-contract-test.sh
          sudo bash ops/restore-production-contract-test.sh
          bash -n ops/restore-failure-state-contract-test.sh
          bash ops/restore-failure-state-contract-test.sh
          bash -n ops/restore-failure-state-integration-test.sh
          bash ops/restore-failure-state-integration-test.sh
          bash ops/restore-verify-guard-contract-test.sh
          python3 ops/restore-allowlist-contract-test.py
      - name: Повна restore-репетиція та adoption/inverse у тимчасовій TimescaleDB
        run: |
          bash -n ops/postgres-adoption-restore-test.sh
          bash ops/postgres-adoption-restore-test.sh
      - name: Відмова production target між двома ізольованими кластерами
        run: |
          bash -n ops/postgres-production-adoption-test.sh
          bash ops/postgres-production-adoption-test.sh
      - name: Контракт production Compose без запуску служб
        run: |
          python3 ops/compose-profile-regression-test.py
          bash ops/compose-production-contract-test.sh
      - name: Черга collector у тимчасовому Docker volume
        run: |
          python3 -m py_compile ops/collector-spool-daemon-test.py
          bash -n ops/collector-spool-integration-test.sh
          bash ops/collector-spool-integration-test.sh
      - name: Compose для контракту collector runtime
        # Match the verified production parser. Compose 2.38.2 resolves raw
        # env_file even with --no-env-resolution and drops its descriptor.
        run: |
          plugin_dir="${RUNNER_TEMP}/collector-runtime-docker/cli-plugins"
          mkdir -p "$plugin_dir"
          curl --fail --location --retry 3 https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64 -o "$plugin_dir/docker-compose"
          echo "db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576  $plugin_dir/docker-compose" | sha256sum --check
          chmod 0755 "$plugin_dir/docker-compose"
      - name: Контракт окремого collector runtime
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/collector-runtime-docker
        run: |
          bash -n ops/collector-runtime-control.sh
          bash -n ops/collector-runtime-control-contract-test.sh
          bash -n ops/collector-runtime-integration-test.sh
          python3 -m py_compile ops/collector-runtime-preflight.py ops/collector-runtime-control.py ops/collector-runtime-daemon-test.py
          python3 ops/collector-runtime-contract-test.py
          bash ops/collector-runtime-control-contract-test.sh
          python3 ops/collector-runtime-daemon-contract-test.py
      - name: Ізольоване Compose-перемикання collector та відкат
        run: bash ops/collector-runtime-integration-test.sh
      - name: Маршрутизація Caddy в ізольованій мережі
        run: |
          bash -n ops/caddy-integration-test.sh
          bash ops/caddy-integration-test.sh
      - name: Контракт планового перезапуску без production
        run: |
          bash ops/maintenance-window-contract-test.sh
          bash ops/maintenance-works-contract-test.sh
      - name: TimescaleDB, міграції, права та запис даних
        run: bash scripts/test_database.sh
      - name: Напливи — профіль, повна зв’язка й синтетичне відновлення
        run: |
          python3 ops/surge-runtime-contract-test.py
          bash -n ops/surge-integration-test.sh
          bash ops/surge-integration-test.sh
      - name: Ізольоване оновлення TimescaleDB зі стисненими даними
        run: |
          bash -n ops/timescale-upgrade-test.sh
          bash ops/timescale-upgrade-test.sh
