# Independent black-box monitor (issue #22, audit F8). The runtime's own
# watchdog alerts over FCM through this same API — so a host/network/Docker
# outage silences the app AND its alarm at once (that is exactly what
# happened 2026-08-14: the outage was noticed only because an operator was
# watching). This job runs on GitHub's infrastructure, not AvelRen's, and
# checks the public endpoint from outside — so it keeps working when the
# host doesn't. Alerting is a GitHub issue (dead-man's-switch: opened once
# per outage, auto-closed on recovery), deliberately avoiding any channel
# that routes back through the AvelRen stack.
name: External health monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write

env:
  HEALTH_URL: https://api.bordersignal.pp.ua/api/health
  OUTAGE_LABEL: monitor:outage
  ALERT_CHANNEL_LABEL: monitor:alert-channel
  UNDELIVERED_LABEL: monitor:undelivered-alerts

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure outage label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$OUTAGE_LABEL" --repo "$GITHUB_REPOSITORY" \
            --color d73a4a \
            --description "Opened by the external health monitor; closes automatically on recovery" \
            --force

      - name: Probe public /health from outside the AvelRen host
        id: probe
        run: |
          set +e
          http_code=$(curl -sS --connect-timeout 10 --max-time 15 \
            -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL")
          curl_exit=$?
          set -e

          status=unknown
          age=null
          if [ "$curl_exit" -eq 0 ] && [ -s /tmp/health.json ]; then
            status=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo unknown)
            age=$(jq -r '.age_seconds // "null"' /tmp/health.json 2>/dev/null || echo null)
          fi

          healthy=false
          if [ "$curl_exit" -eq 0 ] && [ "$http_code" = "200" ] && [ "$status" = "ok" ]; then
            healthy=true
          fi

          {
            echo "healthy=$healthy"
            echo "http_code=$http_code"
            echo "curl_exit=$curl_exit"
            echo "status=$status"
            echo "age=$age"
          } >> "$GITHUB_OUTPUT"

      - name: Find open outage issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "$OUTAGE_LABEL" --state open --json number -q '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # First failing probe after a healthy period: open exactly one issue.
      # Later failing probes while it's still open change nothing here — no
      # per-poll spam, the issue itself is the ongoing signal.
      - name: Open outage issue
        if: steps.probe.outputs.healthy == 'false' && steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔴 external monitor: /health check failing" \
            --label "$OUTAGE_LABEL" \
            --body "Independent check against \`$HEALTH_URL\`, run from GitHub Actions (not the AvelRen host), is failing.

            - HTTP status: \`${{ steps.probe.outputs.http_code }}\`
            - curl exit code: \`${{ steps.probe.outputs.curl_exit }}\`
            - reported status: \`${{ steps.probe.outputs.status }}\`
            - age_seconds: \`${{ steps.probe.outputs.age }}\`
            - first detected: $(date -u +%FT%TZ)

            This issue closes automatically when the next scheduled probe (every 10 min) succeeds. If it does not, /health is still down or unreachable — check the host directly."

      # Recovery: close the one issue this outage opened, with a timestamp
      # so the outage duration is visible in the issue history.
      - name: Close resolved outage issue
        if: steps.probe.outputs.healthy == 'true' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.existing.outputs.number }}" --repo "$GITHUB_REPOSITORY" \
            --body "Recovered: $(date -u +%FT%TZ). HTTP 200, status ok."
          gh issue close "${{ steps.existing.outputs.number }}" --repo "$GITHUB_REPOSITORY"

  # Separate gate (#113): the watchdog cannot alert that its OWN alert channel is
  # empty — it would have to deliver that through the very channel that is empty.
  # So we read the public /health `alert_channel` bit from outside and raise here.
  # It reuses the same dead-man's-switch (open one issue, close on recovery) with
  # a DIFFERENT label, so a day-long empty channel does not spam an issue per poll.
  # This gate catches "empty" (no admin with a live token), NOT "dead" (an expired
  # token) — the latter is #19.
  alert-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ensure alert-channel label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$ALERT_CHANNEL_LABEL" --repo "$GITHUB_REPOSITORY" \
            --color d73a4a \
            --description "External gate: the watchdog alert channel is empty (#113); closes on recovery" \
            --force

      - name: Probe alert_channel a few times and classify
        id: gate
        run: |
          # empty → raise immediately; unknown → only if stably blind (all N in a
          # row); a transient unknown must not cry wolf. Thresholds live in the
          # unit-tested classifier, not here.
          probes=()
          for i in 1 2 3; do
            v=$(curl -sS --connect-timeout 10 --max-time 15 "$HEALTH_URL" \
                  | jq -r '.alert_channel // "unknown"' 2>/dev/null || echo unknown)
            probes+=("$v")
            [ "$i" -lt 3 ] && sleep 5 || true
          done

          set +e
          decision=$(python3 deploy/classify_alert_channel.py "${probes[@]}")
          outage=$?
          set -e

          {
            echo "decision=$decision"
            echo "outage=$outage"
            echo "probes=${probes[*]}"
          } >> "$GITHUB_OUTPUT"

      - name: Find open alert-channel issue
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "$ALERT_CHANNEL_LABEL" --state open --json number -q '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open alert-channel issue
        if: steps.gate.outputs.outage == '1' && steps.existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔴 external monitor: watchdog alert channel is ${{ steps.gate.outputs.decision }}" \
            --label "$ALERT_CHANNEL_LABEL" \
            --body "The public \`/health\` alert-channel bit read from GitHub Actions (outside the AvelRen host) reports an unhealthy channel.

            - decision: \`${{ steps.gate.outputs.decision }}\` (empty = no admin with a live FCM token; blind = /health probe stably unreadable)
            - probes: \`${{ steps.gate.outputs.probes }}\`
            - first detected: $(date -u +%FT%TZ)

            The watchdog physically cannot deliver this alarm itself — the channel it would use is the one that is empty. This gate catches \"empty\", NOT \"dead\" (an admin whose token is present but expired passes green — that is an ack concern, #19). Closes automatically when the next probe reports \`ok\`."

      - name: Ensure undelivered-alerts label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "$UNDELIVERED_LABEL" --repo "$GITHUB_REPOSITORY"             --color d73a4a             --description "External gate: alerts fired but were never delivered (#174); closes on recovery"             --force

      # --- #174: something fired and nobody got it --------------------------
      #
      # A different question from alert_channel. That one asks whether the ADMIN
      # channel can reach anyone; this asks whether an alert a DRIVER subscribed
      # to actually left the building. On 2026-09-06 a threshold alert fired at
      # 04:49, was written without error, and reached nobody for five hours —
      # the subscription still pointed at a device row abandoned when the app
      # re-registered. Both ends read it as success.
      #
      # Read from outside for the same reason as alert_channel: `avelren_watchdog`
      # has no SELECT on `alerts`, and granting it needs an ACL migration the
      # adoption contract blocks until #15.
      - name: Probe undelivered_alerts
        id: undelivered
        run: |
          v=$(curl -sS --connect-timeout 10 --max-time 15 "$HEALTH_URL"                 | jq -r '.undelivered_alerts // "unknown"' 2>/dev/null || echo unknown)
          # Only `stalled` raises. `unknown` is left alone on purpose: an
          # unreadable /health is already the alert-channel gate's business above,
          # and two gates shouting about one outage teach people to mute both.
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Find open undelivered-alerts issue
        id: undelivered_existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY"             --label "$UNDELIVERED_LABEL" --state open --json number -q '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open undelivered-alerts issue
        if: steps.undelivered.outputs.value == 'stalled' && steps.undelivered_existing.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY"             --title "🔴 external monitor: alerts are firing and not being delivered"             --label "$UNDELIVERED_LABEL"             --body "\`/health\` reports \`undelivered_alerts=stalled\`: at least one alert has been pending with \`send_count=0\` for over ten minutes.

            - first detected: $(date -u +%FT%TZ)

            The alert row exists and no error was logged — that is what this failure looks like from the server, and why nothing caught it before #174. Likely causes: the subscription points at a device with no FCM token, the notifier is not running, or FCM rejected the token. Closes automatically when the next probe reports \`ok\`."

      - name: Close resolved undelivered-alerts issue
        if: steps.undelivered.outputs.value == 'ok' && steps.undelivered_existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.undelivered_existing.outputs.number }}" --repo "$GITHUB_REPOSITORY"             --body "Recovered: $(date -u +%FT%TZ). undelivered_alerts=ok."
          gh issue close "${{ steps.undelivered_existing.outputs.number }}" --repo "$GITHUB_REPOSITORY"

      - name: Close resolved alert-channel issue
        if: steps.gate.outputs.outage == '0' && steps.existing.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ steps.existing.outputs.number }}" --repo "$GITHUB_REPOSITORY" \
            --body "Recovered: $(date -u +%FT%TZ). alert_channel=ok."
          gh issue close "${{ steps.existing.outputs.number }}" --repo "$GITHUB_REPOSITORY"
