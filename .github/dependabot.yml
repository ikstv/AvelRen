# Supply-chain gate (issue #23): Dependabot keeps every dependency ecosystem in
# the repo under automated security + version watch. Grouped so a routine bump
# wave arrives as one PR per ecosystem instead of a swarm. CI (the existing
# `ci.yml`) is the gate that proves each bump is safe before it can merge.
version: 2
updates:
  # GitHub Actions — the repo already pins every `uses:` to a commit SHA;
  # Dependabot re-pins to the new SHA (and updates the trailing version comment)
  # when an action releases, so pinning never means silently going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python backend (app/pyproject.toml).
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # Android client (Gradle version catalog + build scripts).
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      android:
        patterns: ["*"]

  # Backend container base images (app/Dockerfile, app/Dockerfile.test).
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    groups:
      backend-images:
        patterns: ["*"]

  # Compose stack images (docker-compose*.yml at the repo root: timescaledb,
  # caddy). The app image is built locally and is not a registry dependency.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
