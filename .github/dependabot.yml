# Supply-chain gate (issue #23): Dependabot keeps every dependency ecosystem in
# the repo under automated security + version watch. CI (ci.yml + codeql.yml) is
# the gate that proves each bump is safe before it can merge.
#
# Grouping rule: minor/patch together, majors on their own — per ecosystem.
#
# The first run of this config grouped EVERYTHING per ecosystem, which produced
# PR #67: fifteen Android updates in one changeset, including Gradle 8.13 -> 9.7,
# AGP 8.7 -> 9.3 and Kotlin 2.0 -> 2.4. That is not a dependency bump, it is a
# coordinated toolchain migration (AGP 9 has built-in Kotlin support, so
# `org.jetbrains.kotlin.android` must be REMOVED from the build script), and it
# failed CI immediately. Bundled with routine patches it is also unreviewable:
# nothing in it can land until the migration is done.
#
# Splitting by update-type keeps routine and security bumps flowing green and
# mergeable on their own, while each breaking migration arrives as an isolated,
# clearly-scoped PR that can be planned — see issue #18, which explicitly says
# not to combine the Android API 36 track with a broad dependency upgrade.
version: 2
updates:
  # GitHub Actions — the repo pins every `uses:` to a commit SHA; Dependabot
  # re-pins to the new SHA (and updates the trailing version comment) on release,
  # so pinning never means silently going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]

  # Python backend (app/pyproject.toml).
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
      python-major:
        patterns: ["*"]
        update-types: [major]

  # Android client (Gradle version catalog + build scripts).
  #
  # Version updates are PARKED (open-pull-requests-limit: 0) until the toolchain
  # migration tracked in issue #18 lands. Security updates still open — the limit
  # only suppresses routine version PRs, never security ones.
  #
  # Why parked: the Android toolchain is entangled and moves as one unit. Even a
  # nominally "minor" bump breaks the build — PR #71 raised Kotlin 2.0.21→2.4.10
  # (semver-minor) and it failed with `jvmTarget: String is an error, migrate to
  # the compilerOptions DSL`; PR #67 raised AGP 8→9 + Gradle 8→9 which additionally
  # requires removing the org.jetbrains.kotlin.android plugin. Kotlin, ktor, AGP
  # and Gradle must be upgraded together, with build-script changes and a real
  # Android 16 device check — that is issue #18, not a Dependabot auto-merge. Left
  # un-parked, Dependabot reopens an un-mergeable red PR every week.
  #
  # Un-park (delete open-pull-requests-limit) once #18 has moved the toolchain
  # onto current AGP/Gradle/Kotlin and the build script uses the compilerOptions
  # DSL, so routine bumps build green again.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  # Backend container base images (app/Dockerfile, app/Dockerfile.test).
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    groups:
      backend-images:
        patterns: ["*"]
        update-types: [minor, patch]
      backend-images-major:
        patterns: ["*"]
        update-types: [major]

  # Compose stack images (docker-compose*.yml at the repo root: timescaledb,
  # caddy). The app image is built locally and is not a registry dependency.
  # A major here means a PostgreSQL/TimescaleDB major — a data-migration event,
  # never a routine bump, so it must arrive alone.
  #
  # `docker-compose`, not `docker`: the docker ecosystem reads Dockerfiles and
  # Kubernetes manifests only, so this entry aborted every week with
  # "No Dockerfiles nor Kubernetes YAML found in /" (job 100890650049) and the
  # compose pins were never actually watched — a silent hole in the #23 gate,
  # since a failing updater looks the same as one with nothing to do.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
        update-types: [minor, patch]
      compose-images-major:
        patterns: ["*"]
        update-types: [major]
