# Спільний build-спец для всіх сервісів на образі `avelren-app:latest`.
# SOURCE_COMMIT прокидується у Dockerfile як ARG → env AVELREN_GIT_SHA, який
# `/admin/telemetry.version.git_sha` віддає Server Dashboard. Дефолт — пустий
# рядок: краще null на клієнті, ніж підроблене «unknown» (див. N5 review #34).
#
# Deploy runbook експортує змінну перед build:
#   export SOURCE_COMMIT=$(git rev-parse HEAD)
#   sudo -E docker compose build migrate
# Без `sudo -E` env-змінна не долітає до docker compose під sudo.
x-avelren-build: &avelren-build
  context: ./app
  args:
    SOURCE_COMMIT: ${SOURCE_COMMIT:-}

services:
  db:
    # Reproducible builds (issue #23): external images are pinned to a digest,
    # not just a tag. A tag like `2.17.2-pg16` can be re-pushed to a different
    # image; the digest cannot. The human-readable tag is kept alongside for
    # legibility, and Dependabot's docker ecosystem watches the digest and opens
    # a PR when the upstream image is re-published. Digests captured from the
    # images the production host is already running (2026-08-15).
    image: timescale/timescaledb:2.17.2-pg16@sha256:4e459e217f00cbb09920c34d245501e63427e6767a495de57ce76823ff280f12
    restart: unless-stopped
    # Resource ceilings so no single container can starve the host and take
    # PostgreSQL down with it (audit MED). db gets the largest share.
    mem_limit: 1g
    cpus: 1.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Виконується до кожного старту сервісів і завершується. Так схема БД не
  # може розійтися з кодом через забуту міграцію.
  #
  # ЧОМУ migrate НЕ за `profiles:`, хоча неявний старт — реальна небезпека.
  # migrate.py застосовує ВСІ *.sql, яких немає в schema_migrations, без піна
  # максимальної версії, тож будь-який `compose up`, що затягне migrate як
  # залежність, застосує 010 поза adoption (модель: «3B.2 лишає 009, штамп на
  # 3D»). Профіль прибрав би migrate з дефолтного набору й закрив це
  # структурно — але зробити його робочим можна лише додавши `required: false`
  # на чотири ребра depends_on нижче, інакше Compose визнає модель невалідною
  # щоразу, коли профіль неактивний («depends on undefined service "migrate":
  # invalid compose project», exit 1 — валить навіть `config`).
  #
  # А `required: false` знімає fail-closed НЕ лише для «сервіс відсутній», а й
  # для «сервіс присутній і ВПАВ». Перевірено прямим експериментом на
  # compose v5.3.1: з `required: false` і активним профілем провалений migrate
  # (exit 1) пропускає api до старту, і `up` повертає 0; без нього той самий
  # провал зупиняє старт із exit 1. Тобто ціна профілю — та сама властивість
  # fail-closed, яку migrate.py декларує дослівно (A-07), і яку більше нічим не
  # підстрахувати: жоден сервіс не звіряє версію схеми при старті.
  #
  # Тому запобіжник тут один і на місці виклику — `--no-deps` в обох рестартах
  # adopt.sh. Профіль повернеться, коли fail-closed переїде в застосунок
  # (старт-перевірка max(version)), тобто туди, де його не обійти способом
  # запуску.
  migrate:
    build: *avelren-build
    image: avelren-app:latest
    command: ["python", "-m", "avelren.migrate"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      DATABASE_URL: ${AVELREN_MIGRATOR_DSN}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ./db/migrations:/migrations:ro
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  collector:
    build: *avelren-build
    image: avelren-app:latest
    restart: unless-stopped
    command: ["python", "-m", "avelren.collector"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      DATABASE_URL: ${AVELREN_COLLECTOR_DSN}
      ECHERHA_BASE_URL: ${ECHERHA_BASE_URL}
      ECHERHA_VEHICLE_TYPE: ${ECHERHA_VEHICLE_TYPE}
      # The collector identifies itself to eCherha with a device identity.
      # config.py requires ECHERHA_DEVICE_ID to be a valid UUID; without these
      # the collector aborts at startup with "ECHERHA_DEVICE_ID must be a valid
      # UUID" and collects nothing. They were missing here while present in .env,
      # so a container recreated from the current compose could not collect
      # (surfaced by the 2026-08-14 adoption incident, which recreated it).
      ECHERHA_API_VERSION: ${ECHERHA_API_VERSION}
      ECHERHA_CLIENT_VERSION: ${ECHERHA_CLIENT_VERSION}
      ECHERHA_DEVICE_ID: ${ECHERHA_DEVICE_ID}
      ECHERHA_DEVICE_NAME: ${ECHERHA_DEVICE_NAME}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      LOG_LEVEL: ${LOG_LEVEL}
      REARM_FACTOR: ${REARM_FACTOR}
    # Ребро БЕЗ `required: false` — навмисно: воно і є fail-closed. Провалений
    # migrate мусить зупинити старт (перевірено: `up` виходить з 1 і сервіс не
    # піднімається). Деталі компромісу — у коментарі до migrate вище.
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Окремо від збирача: історія має накопичуватись, навіть якщо FCM лежить.
  notifier:
    build: *avelren-build
    image: avelren-app:latest
    restart: unless-stopped
    command: ["python", "-m", "avelren.notifier"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      DATABASE_URL: ${AVELREN_NOTIFIER_DSN}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH}
      ALERT_RESEND_SECONDS: ${ALERT_RESEND_SECONDS}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Помічає, що система замовкла. Найнебезпечніший збій — тихий.
  watchdog:
    build: *avelren-build
    image: avelren-app:latest
    restart: unless-stopped
    command: ["python", "-m", "avelren.watchdog"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      DATABASE_URL: ${AVELREN_WATCHDOG_DSN}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ./secrets:/secrets:ro
      # host-факти (backup-stamp, reboot-required) беремо з host-snapshot, як
      # API за SEC-1 — без монтування всього /run (де є й docker.sock; аудит
      # M-1). Snapshot пише systemd-таймер (deploy/telemetry-snapshot.sh).
      - /var/lib/avelren-telemetry:/telemetry:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: *avelren-build
    image: avelren-app:latest
    restart: unless-stopped
    command: ["uvicorn", "avelren.api:app", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 512m
    cpus: 1.0
    environment:
      DATABASE_URL: ${AVELREN_API_DSN}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}
      ECHERHA_VEHICLE_TYPE: ${ECHERHA_VEHICLE_TYPE}
    volumes:
      # Тільки host-telemetry snapshot: JSON пише systemd-таймер на хості
      # (deploy/telemetry-snapshot.sh), API його лише читає. Ніяких /secrets,
      # /proc, /run у public контейнері — RCE у FastAPI більше не веде до
      # Firebase service-account (аудит SEC-1 / A-01).
      - /var/lib/avelren-telemetry:/telemetry:ro
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.9.1-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
