services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Виконується до кожного старту сервісів і завершується. Так схема БД не
  # може розійтися з кодом через забуту міграцію.
  migrate:
    build: ./app
    image: avelren-app:latest
    command: ["python", "-m", "avelren.migrate"]
    env_file: .env
    volumes:
      - ./db/migrations:/migrations:ro
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  collector:
    build: ./app
    image: avelren-app:latest
    restart: unless-stopped
    command: ["python", "-m", "avelren.collector"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Окремо від збирача: історія має накопичуватись, навіть якщо FCM лежить.
  notifier:
    build: ./app
    image: avelren-app:latest
    restart: unless-stopped
    command: ["python", "-m", "avelren.notifier"]
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Помічає, що система замовкла. Найнебезпечніший збій — тихий.
  watchdog:
    build: ./app
    image: avelren-app:latest
    restart: unless-stopped
    command: ["python", "-m", "avelren.watchdog"]
    env_file: .env
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./app
    image: avelren-app:latest
    restart: unless-stopped
    command: ["uvicorn", "avelren.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
