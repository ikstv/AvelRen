# Спільний build-спец для всіх сервісів на образі `avelren-app:latest`.
# SOURCE_COMMIT прокидується у Dockerfile як ARG → env AVELREN_GIT_SHA, який
# `/admin/telemetry.version.git_sha` віддає Server Dashboard. Дефолт — пустий
# рядок: краще null на клієнті, ніж підроблене «unknown» (див. N5 review #34).
#
# Deploy runbook експортує змінну перед build:
#   export SOURCE_COMMIT=$(git rev-parse HEAD)
#   sudo -E docker compose build migrate
# Без `sudo -E` env-змінна не долітає до docker compose під sudo.
x-avelren-build: &avelren-build
  context: ./app
  args:
    SOURCE_COMMIT: ${SOURCE_COMMIT:-}

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    # Resource ceilings so no single container can starve the host and take
    # PostgreSQL down with it (audit MED). db gets the largest share.
    mem_limit: 1g
    cpus: 1.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Виконується до кожного старту сервісів і завершується. Так схема БД не
  # може розійтися з кодом через забуту міграцію.
  migrate:
    build: *avelren-build
    image: avelren-app:latest
    command: ["python", "-m", "avelren.migrate"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      DATABASE_URL: ${AVELREN_MIGRATOR_DSN}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ./db/migrations:/migrations:ro
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  collector:
    build: *avelren-build
    image: avelren-app:latest
    restart: unless-stopped
    command: ["python", "-m", "avelren.collector"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      DATABASE_URL: ${AVELREN_COLLECTOR_DSN}
      ECHERHA_BASE_URL: ${ECHERHA_BASE_URL}
      ECHERHA_VEHICLE_TYPE: ${ECHERHA_VEHICLE_TYPE}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
      LOG_LEVEL: ${LOG_LEVEL}
      REARM_FACTOR: ${REARM_FACTOR}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Окремо від збирача: історія має накопичуватись, навіть якщо FCM лежить.
  notifier:
    build: *avelren-build
    image: avelren-app:latest
    restart: unless-stopped
    command: ["python", "-m", "avelren.notifier"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      DATABASE_URL: ${AVELREN_NOTIFIER_DSN}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH}
      ALERT_RESEND_SECONDS: ${ALERT_RESEND_SECONDS}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Помічає, що система замовкла. Найнебезпечніший збій — тихий.
  watchdog:
    build: *avelren-build
    image: avelren-app:latest
    restart: unless-stopped
    command: ["python", "-m", "avelren.watchdog"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      DATABASE_URL: ${AVELREN_WATCHDOG_DSN}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ./secrets:/secrets:ro
      # host-факти (backup-stamp, reboot-required) беремо з host-snapshot, як
      # API за SEC-1 — без монтування всього /run (де є й docker.sock; аудит
      # M-1). Snapshot пише systemd-таймер (deploy/telemetry-snapshot.sh).
      - /var/lib/avelren-telemetry:/telemetry:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: *avelren-build
    image: avelren-app:latest
    restart: unless-stopped
    command: ["uvicorn", "avelren.api:app", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 512m
    cpus: 1.0
    environment:
      DATABASE_URL: ${AVELREN_API_DSN}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS}
      ECHERHA_VEHICLE_TYPE: ${ECHERHA_VEHICLE_TYPE}
    volumes:
      # Тільки host-telemetry snapshot: JSON пише systemd-таймер на хості
      # (deploy/telemetry-snapshot.sh), API його лише читає. Ніяких /secrets,
      # /proc, /run у public контейнері — RCE у FastAPI більше не веде до
      # Firebase service-account (аудит SEC-1 / A-01).
      - /var/lib/avelren-telemetry:/telemetry:ro
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
