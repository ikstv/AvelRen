services:
  test-db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: avelren
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: avelren_ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avelren -d avelren_ci"]
      interval: 5s
      timeout: 5s
      retries: 20

  test:
    build:
      context: .
      dockerfile: app/Dockerfile.test
    environment:
      DATABASE_URL: postgresql://avelren:ci-only@test-db:5432/avelren_ci
      AVELREN_TEST_DB: "1"
    depends_on:
      test-db:
        condition: service_healthy
